name: Compile and run unit tests

on:
  push:
    branches:
      - 'beta.*'
      - 'canary'
      - 'develop'
      - 'frame-community-edition'
  pull_request:

jobs:
  # Doyensec Electronegativity is unmaintained (last npm release 2023). On this
  # fork the inherited step failed in ~10s with exit code 1 and skipped compile
  # + unit tests. The CLI only process.exit(1) on exceptions / bad args — not
  # after writing a findings SARIF — so that was scanner/runtime, not "hide
  # findings". Keep the scan visible; do not gate the inherited build on it.
  # Fork CI also may lack code-scanning upload permissions / NPM_AUTH_TOKEN.
  # Node 20 deprecation on checkout/setup-node@v4 is a runner warning only.
  electronegativity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.12.1
      - name: Electronegativity
        continue-on-error: true
        uses: doyensec/electronegativity-action@v2.0
      - name: Upload sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: ../electronegativity_results
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.12.1
      - run: |
          sudo apt update -y
          sudo apt install -y libudev-dev
      - run: npm run setup:ci
      - run: npm run compile
      - run: npm run test:unit
